# Reverse proxy in front of the built-in server (:8787).
# Public:    /health only
# Protected: everything else (operator dashboard, /cards/ gallery, renders, /api/*) behind HTTP basic auth.
#            Buyers never receive links to this server; the deliverable is the self-contained zip.
#            (htpasswd file: /etc/nginx/holo-card.htpasswd — created by server-bootstrap.sh).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 50m;

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_basic "Holo Card Agent";
        auth_basic_user_file /etc/nginx/holo-card.htpasswd;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
