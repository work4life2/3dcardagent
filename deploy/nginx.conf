# Reverse proxy in front of the built-in server (:8787).
# Public:    /health only.
# Operator:  everything (dashboard, /api/*, /cards/ gallery, renders) lives under the secret prefix
#            __DASH__ (DASHBOARD_PATH in .env.local; deploy/deploy.sh substitutes it), behind HTTP
#            basic auth (htpasswd: /etc/nginx/holo-card.htpasswd) and a per-IP request limit so the
#            password cannot be brute-forced quickly. Any other path is a bare 404: a visitor hitting
#            the IP sees nothing.
#            Buyers never receive links to this server; the deliverable is the self-contained zip.
# The limit_req zone is declared in /etc/nginx/conf.d/holo-card-agent.conf (deploy/nginx-http.conf).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 50m;

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location __DASH__/ {
        auth_basic "Holo Card Agent";
        auth_basic_user_file /etc/nginx/holo-card.htpasswd;
        limit_req zone=holo_dash burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location = __DASH__ {
        return 301 __DASH__/;
    }

    location / {
        return 404;
    }
}
