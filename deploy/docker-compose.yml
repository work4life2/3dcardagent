# docker compose -f deploy/docker-compose.yml up -d
# The container uses the host network so that the local proxy on 127.0.0.1:1080 is reachable
# and the gallery is served on the host's port 8787.
services:
  holo-card-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: holo-card-agent:latest
    container_name: holo-card-agent
    network_mode: host
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATA_DIR: /data
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8787"
      PROXY_URL: http://127.0.0.1:1080
    volumes:
      - holo-data:/data
    # one-off setup inside the container:
    #   docker compose -f deploy/docker-compose.yml run --rm holo-card-agent setup
    #   docker compose -f deploy/docker-compose.yml run --rm holo-card-agent setup link
    #   docker compose -f deploy/docker-compose.yml run --rm holo-card-agent setup listing

volumes:
  holo-data:
