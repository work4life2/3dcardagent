# http-context bits for the holo-card site (installed to /etc/nginx/conf.d/holo-card-agent.conf).
# 10 requests/s per IP on the operator prefix; the dashboard polls 3 endpoints every 15 s, so real
# use never gets near it, but a password guesser is throttled to ~36k tries/hour instead of millions.
limit_req_zone $binary_remote_addr zone=holo_dash:1m rate=10r/s;
